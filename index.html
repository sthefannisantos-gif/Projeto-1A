<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background-color: rgb(201, 168, 214);
            color: beige;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 5px solid rgb(112, 34, 77);
            padding: 16px;
        }
        main{
            background-color: rgb(191, 171, 209);
            color: aliceblue;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            p.autor {
                font-weight: bold;
                
        }
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>
      <h1>SITE DO 1A</h1> 
        <p>aprender a fazer um site</p>
    </header>
    <main>
        <img src="imagem.png" alt="Imagem de aula de educação digital">
        <div>
        <h2>Educacao digital</h2>
        <p class="autor">por:Sthefanni</p>
        <p>Este site e para a aula de educacao digital do 1A</p>
        <button>💖<span>0</span></button>
        </div>
    </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);
    function botaoClicado () {
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>
</html>
